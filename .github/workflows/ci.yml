name: CI

on:
  pull_request:
    branches: [main, dev]
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install check dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests and policy checks
        run: python -m pytest tests -q

      - name: Run DuckDB sanity checks
        run: |
          python -m pip install duckdb pandas
          python tests/duckdb_check_fare_per_mile.py

  pr-description:
    name: PR links an issue
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$PR_BODY" | grep -Eiq '(closes|fixes|resolves|part of|related to) #[0-9]+'; then
            echo "Linked issue found."
          else
            echo "::error::Add the issue to the PR description, e.g. 'Closes #24' or 'Part of #49'."
            exit 1
          fi
